on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the native library
        run: make -j"$(nproc)"

      - name: Install Python dependencies
        run: pip install requests argon2-cffi

      - name: Compile-check the Python API
        run: python3 -m py_compile anubis_solver.py tests/*.py tools/*.py

      - name: Unit tests (cross-checked against hashlib and argon2-cffi)
        run: python3 tests/test_core.py
