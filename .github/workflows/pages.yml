# Publish the documentation site in web/ to GitHub Pages.
#
# Pages only accepts "/" or "/docs" as a source path, and this repository keeps
# the site in web/ (and docs/ holds Markdown, not HTML), so the site is published
# as an Actions artifact rather than from a directory.
#
# The site is plain HTML with no build step, so the job is: check it, upload it.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # links, anchors, duplicate ids, tag balance, nav reachability, and that
      # nothing on the site pulls a subresource from another origin
      - name: Lint the site
        run: python3 web/check.py

      # the layout check needs a browser; ubuntu-latest has Chrome preinstalled
      - name: Layout check at phone and desktop widths
        run: |
          # serve web/ itself: the pages are at the root of the site, so serving
          # the repository root would 404 every one of them
          python3 -m http.server 8090 --bind 127.0.0.1 --directory web >/dev/null 2>&1 &
          sleep 1
          node web/check-layout.mjs --width 390
          node web/check-layout.mjs --width 1280

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
