<!doctype html><meta charset="utf-8"><title>digest</title>
<script type="module">
try {
  const code = await (await fetch('./hashx.wgsl')).text();
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  const device = await adapter.requestDevice();
  const module = device.createShaderModule({ code });
  const info = await module.getCompilationInfo();
  const errs = info.messages.filter((m) => m.type === 'error');
  if (errs.length) { window.__d = { error: errs.map((m) => `line ${m.lineNum}: ${m.message}`).join('; ') }; throw 0; }
  const pbuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const size = 16 + 8 * 4 + 64 * 4;
  const rbuf = device.createBuffer({ size, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
  const mbuf = device.createBuffer({ size, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const pipe = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'main' } });
  const bg = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [
    { binding: 0, resource: { buffer: pbuf } }, { binding: 1, resource: { buffer: rbuf } }] });
  device.queue.writeBuffer(rbuf, 0, new Uint32Array(size / 4));
  device.queue.writeBuffer(pbuf, 0, new Uint32Array([0, 0, 0, 1]));
  const e = device.createCommandEncoder(); const pass = e.beginComputePass();
  pass.setPipeline(pipe); pass.setBindGroup(0, bg); pass.dispatchWorkgroups(1); pass.end();
  device.queue.submit([e.finish()]);
  const e2 = device.createCommandEncoder(); e2.copyBufferToBuffer(rbuf, 0, mbuf, 0, size); device.queue.submit([e2.finish()]);
  await mbuf.mapAsync(GPUMapMode.READ);
  const u = new Uint32Array(mbuf.getMappedRange().slice(0)); mbuf.unmap();
  const words = Array.from(u.slice(12, 20));
  const bytes = new Uint8Array(32); const dv = new DataView(bytes.buffer);
  for (let i = 0; i < 4; i++) { dv.setUint32(8 * i, words[2 * i], true); dv.setUint32(8 * i + 4, words[2 * i + 1], true); }
  window.__d = { digest: [...bytes].map((b) => b.toString(16).padStart(2, '0')).join(''), total: u[0] };
} catch (e) { window.__d = { error: String(e) }; }
</script>
