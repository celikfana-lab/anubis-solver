on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the native library
        run: make -j"$(nproc)"

      - name: Install Python dependencies
        run: pip install requests argon2-cffi

      - name: Compile-check the Python API
        run: python3 -m py_compile anubis_solver.py tests/*.py tools/*.py examples/*.py

      - name: TEMP candidate and solver benchmark (C, no ctypes)
        run: |
          cat > /tmp/bench.c <<'EOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          extern long sha256_sve2_width(void);
          extern void sha256_compress_sve2(const uint32_t mid[8], const uint8_t tails[][64], uint8_t out[][32]);
          extern void sha256_block_neon(uint32_t state[8], const uint8_t block[64]);
          extern int anubis_solve_bits(const char *hex, int difficulty, int threads,
                                       double budget_ms, uint32_t *nonce, char *hexout, double *ms);
          static double now(void) { struct timespec ts; clock_gettime(CLOCK_MONOTONIC, &ts); return ts.tv_sec + ts.tv_nsec / 1e9; }
          int main(void) {
              long lanes = sha256_sve2_width();
              uint32_t mid[8] = {0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19};
              static uint8_t tails[16][64], out[16][32];
              for (long l = 0; l < lanes; l++) {
                  memset(tails[l], 0, 64);
                  char s[8]; int n = snprintf(s, sizeof s, "%ld", l);
                  memcpy(tails[l], s, n); tails[l][n] = 0x80;
                  uint64_t bits = (64 + n) * 8;
                  for (int i = 0; i < 8; i++) tails[l][56+i] = (uint8_t)(bits >> (8*(7-i)));
              }
              long iters = 100000;
              sha256_compress_sve2((const uint32_t *)mid, (const uint8_t (*)[64])tails, out);
              double t0 = now();
              for (long i = 0; i < iters; i++) sha256_compress_sve2((const uint32_t *)mid, (const uint8_t (*)[64])tails, out);
              double dt = now() - t0;
              printf("sve2 batch  : %6.1f ns/candidate  (%ld lanes)\n", dt*1e9/(iters*(double)lanes), lanes);
              uint32_t st[8] = {0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19};
              sha256_block_neon(st, tails[0]);
              t0 = now();
              for (long i = 0; i < iters * lanes; i++) sha256_block_neon(st, tails[0]);
              dt = now() - t0;
              printf("neon+crypto : %6.1f ns/block       (1 lane)\n", dt*1e9/(iters*(double)lanes));
              char hex[129];
              for (int i = 0; i < 64; i++) snprintf(hex + 2*i, 3, "%02x", i);
              int reps = 10; double total = 0; uint32_t nonce; char dg[65];
              for (int r = 0; r < reps; r++) {
                  double ms = 0;
                  if (anubis_solve_bits(hex, 20, 1, 60000.0, &nonce, dg, &ms) != 0) { printf("solve failed\n"); return 1; }
                  total += ms;
              }
              printf("solver @20b : %6.2f ms/solve -> %.1f Mh/s (%sSVE2 batch)\n",
                     total/reps, (1048576.0*reps)/(total/1000.0)/1e6,
                     getenv("ANUBIS_NO_SVE2") ? "NO " : "");
              return 0;
          }
          EOF
          cc -O2 -o /tmp/bench /tmp/bench.c -L. -lanubis_solver -Wl,-rpath,"$PWD"
          echo "--- SVE2 batch path on:"
          /tmp/bench
          echo "--- SVE2 batch path off (ANUBIS_NO_SVE2=1):"
          ANUBIS_NO_SVE2=1 /tmp/bench

      - name: Unit tests (cross-checked against hashlib and argon2-cffi)
        run: python3 tests/test_core.py

      - name: The gate's pure-JavaScript solvers
        run: |
          node betterAnusbis/tests_js_sha256.mjs
          node betterAnusbis/tests_js_hashx.mjs
          node betterAnusbis/tests_js_argon2id.mjs
          node betterAnusbis/tests_js_tensor.mjs

      - name: build the C services
        run: make -j4 services

      - name: C services tests
        run: |
          make test-api
          make test-mcp
          # No libcurl-impersonate on the runner, so this proves the OpenSSL
          # fallback path and prints SKIP; the fingerprint itself is tested
          # locally (make test-impersonate) against a bundled library.
          make test-impersonate

      - name: TPU backend self-test (graceful path without libtpu)
        run: make test-tpu

      - name: One .so for every machine
        run: make test-universal

      - name: tensor CUDA test (skips without a device)
        run: python3 tests/test_tensor_cuda.py

  # The aarch64 kernels in src/cpu/arm/ are hand-written: neon.s folds one
  # block with the ARMv8 SHA-2 extension, sve2.s vectorizes N candidates with
  # SVE2. Neither can be assembled or executed on the x86 job above, so the
  # same build+test runs here on real arm64 hardware. 24.04 is the current
  # image, 22.04 the older toolchain (binutils 2.38, gcc 11) that still has to
  # assemble the .arch directives.
  arm64:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    name: arm64 asm (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests argon2-cffi

      - name: Build the native library
        run: make -j"$(nproc)"

      - name: Which kernels this CPU has
        run: |
          lscpu | grep -E 'Model name|Model' || true
          grep -m1 '^Features' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(sve|sve2|sha2|sha3)$' | sort | tr '\n' ' '; echo
          python3 - <<'PY'
          import ctypes, os
          lib = ctypes.CDLL(os.path.abspath("libanubis_solver.so"))
          if hasattr(lib, "sha256_sve2_width"):
              lib.sha256_sve2_width.restype = ctypes.c_long
              print("SVE2 kernel lanes:", lib.sha256_sve2_width())
          else:
              print("SVE2 kernel: not built")
          PY

      - name: SVE2 batch kernel parity
        run: python3 tests/test_cpu_sve2.py

      - name: Unit tests (cross-checked against hashlib and argon2-cffi)
        run: python3 tests/test_core.py

      - name: Unit tests with the SVE2 batch path off
        env:
          ANUBIS_NO_SVE2: "1"
        run: python3 tests/test_core.py
