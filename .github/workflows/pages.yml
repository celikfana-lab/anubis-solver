# Publish the documentation site in web/ to GitHub Pages.
#
# Pages only accepts "/" or "/docs" as a source path, and this repository keeps
# the site in web/ (and docs/ holds Markdown, not HTML), so the site is published
# as an Actions artifact rather than from a directory.
#
# The site is plain HTML with no build step, so the job is: check it, upload it.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # links, anchors, duplicate ids, tag balance, nav reachability, and that
      # nothing on the site pulls a subresource from another origin
      - name: Lint the site
        run: python3 web/check.py

      # The layout check needs a headless browser, and a runner where Chrome
      # cannot start is an environment failure, not a site failure: exit 2 means
      # "could not run" and is downgraded to a warning, while exit 1 (a page that
      # really does overflow) still fails the deploy. Run it locally with
      # `cd web && make check` for a trustworthy answer.
      - name: Layout check at phone and desktop widths (best effort)
        run: |
          # serve web/ itself: the pages are at the root of the site, so serving
          # the repository root would 404 every one of them
          python3 -m http.server 8090 --bind 127.0.0.1 --directory web >/dev/null 2>&1 &
          sleep 1
          # Actions runs this with `bash -e`, so a bare `node ...; rc=$?` exits
          # before the assignment: capture with `||` instead.
          rc=0
          node web/check-layout.mjs --width 390  || rc=$?
          node web/check-layout.mjs --width 1280 || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::headless Chrome could not be driven on this runner; layout check skipped"
            exit 0
          fi
          exit "$rc"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
