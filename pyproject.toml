[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libanubis-solver"
version = "2.50"
description = "C proof-of-work engine for Anubis challenges: fast, slow, sha256, argon2id, hashx, tensor, tensor-v - with CUDA, Level Zero, Vulkan, OpenCL and TPU backends"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
authors = [{ name = "celikfana" }]
maintainers = [{ name = "celikfana" }]
# Not plain MIT: the LICENSE requires the credit line. PEP 621 has no way to
# express that, so the text says it and the README repeats it.
license = { text = "MIT with attribution requirements - see LICENSE" }
keywords = [
    "anubis", "proof-of-work", "pow", "sha256", "argon2id", "hashx", "tensor",
    "cuda", "vulkan", "opencl", "level-zero", "tpu",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
# browser TLS/HTTP2 fingerprint impersonation (HAVE_CURL_CFFI in the module)
impersonate = ["curl_cffi>=0.7"]

[project.urls]
Homepage = "https://gitlab.com/celikfana/anubis-solver"
Source = "https://gitlab.com/celikfana/anubis-solver"
Documentation = "https://celikfana.gitlab.io/anubis-solver/"

[project.scripts]
anubis-solver = "anubis_solver:cli"

[tool.setuptools]
py-modules = ["anubis_solver"]
packages = ["_anubis_solver_native"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
_anubis_solver_native = ["libanubis_solver.so", "libanubis_solver.dylib"]
